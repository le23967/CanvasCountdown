# Builds and checks the Windows version. It reads only windows/ and never
# touches the macOS project, whose builds stay on the Mac.
name: Windows

on:
  push:
    branches: [windows-port]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  core:
    name: Core tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: >
          dotnet test windows/tests/CanvasCountdown.Core.Tests -c Release
          --logger "trx;LogFileName=core.trx"
          --results-directory windows/TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-results
          path: windows/TestResults

  app:
    name: App (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runner: windows-2025
          - arch: arm64
            platform: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish windows/src/CanvasCountdown.App/CanvasCountdown.App.csproj
          -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -o windows/artifacts/app-${{ matrix.arch }}
      - name: Smoke test
        shell: pwsh
        run: >
          windows/scripts/smoke-test.ps1
          -AppExe windows/artifacts/app-${{ matrix.arch }}/CanvasCountdown.exe
          -OutputDirectory windows/artifacts/smoke-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: windows/artifacts/smoke-${{ matrix.arch }}
      # Drives the real window as a person would, with invented coursework,
      # and photographs the window alone at every step.
      - name: UI tour
        shell: pwsh
        run: |
          # A fresh runner can have the Start menu, search or the first
          # sign-in screen open over everything; none of them is the app's.
          Get-Process -Name 'StartMenuExperienceHost', 'SearchHost', 'SearchApp', 'WWAHost', 'UserOOBEBroker' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          dotnet run --project windows/tests/CanvasCountdown.UiTour -c Release -- `
            --app "${{ github.workspace }}/windows/artifacts/app-${{ matrix.arch }}/CanvasCountdown.exe" `
            --out "${{ github.workspace }}/windows/artifacts/tour-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tour-${{ matrix.arch }}
          path: windows/artifacts/tour-${{ matrix.arch }}

  installer:
    name: Installer and updates (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build three consecutive versions
        shell: pwsh
        run: |
          windows/scripts/build-release.ps1 -Architectures ${{ matrix.arch }} -SkipTests -Version 1.0.0 -OutputDirectory windows/artifacts/v1
          windows/scripts/build-release.ps1 -Architectures ${{ matrix.arch }} -SkipTests -Version 1.0.1 -OutputDirectory windows/artifacts/v2
          windows/scripts/build-release.ps1 -Architectures ${{ matrix.arch }} -SkipTests -Version 1.0.2 -SimulateFailure -OutputDirectory windows/artifacts/v3
      - name: Install, update, fail an update, uninstall
        shell: pwsh
        run: >
          windows/scripts/test-installer.ps1
          -FirstInstaller windows/artifacts/v1/CanvasCountdown-Windows-1.0.0-${{ matrix.arch }}-setup.exe
          -NextInstaller windows/artifacts/v2/CanvasCountdown-Windows-1.0.1-${{ matrix.arch }}-setup.exe
          -BrokenInstaller windows/artifacts/v3/CanvasCountdown-Windows-1.0.2-${{ matrix.arch }}-setup.exe
          -FirstVersion 1.0.0 -NextVersion 1.0.1
          -LogDirectory windows/artifacts/installer-logs-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-logs-${{ matrix.arch }}
          path: windows/artifacts/installer-logs-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: installer-${{ matrix.arch }}
          path: windows/artifacts/v1/CanvasCountdown-Windows-*-setup.exe
